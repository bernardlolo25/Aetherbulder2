<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AetherBuilder - Public Site</title>
  <meta http-equiv="refresh" content="0;url=/?view=public">
  <script>
    window.location.replace('/?view=public' + window.location.hash);
  </script>
  <style>
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(99,102,241,0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a { color: #818cf8; text-decoration: none; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Loading Live Public Site...</p>
  <p><a href="/?view=public">Click here if you are not redirected automatically</a></p>
</body>
</html>
